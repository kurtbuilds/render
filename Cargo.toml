[package]
name = "render_api"
edition = "2021"
version = "1.1.2"
description = "Render client, generated from the OpenAPI spec."
homepage = "https://github.com/libninjacom/render-rs"
documentation = "https://docs.rs/render-api"
readme = "README.md"
license = "MIT"
repository = "https://github.com/libninjacom/render-rs"

[workspace]
members = ["cli"]

[dependencies]
futures = "0.3.25"
httpclient = "0.23.9"
serde_json = "1.0.81"

[dependencies.chrono]
version = "0.4.23"
features = ["serde"]
default-features = false

[dependencies.serde]
version = "1.0.137"
features = ["derive"]

[dev-dependencies.tokio]
version = "1.18.2"
features = ["full"]